<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RyukWatches – Watch Anime Free</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0f0f;
  --bg2:#161616;
  --bg3:#1e1e1e;
  --bg4:#252525;
  --accent:#ffbe00;
  --accent2:#e5a800;
  --blue:#3db5ff;
  --green:#4ade80;
  --pink:#ff6b9d;
  --text:#e0e0e0;
  --text2:#999;
  --text3:#555;
  --border:#242424;
}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;overflow-x:hidden}

.topnav{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.logo{font-size:1.2rem;font-weight:800;color:#fff;letter-spacing:-0.5px}
.logo span{color:var(--accent)}
.nav-right{display:flex;align-items:center;gap:6px}
.nav-btn{padding:5px 12px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;border:none;font-family:'Inter',sans-serif}
.btn-login{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.btn-signup{background:var(--accent);color:#000}
.search-icon-btn{width:30px;height:30px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px}

.search-bar{display:none;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border)}
.search-bar.open{display:flex;gap:6px}
.search-bar input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:7px 10px;color:var(--text);font-size:12px;outline:none;font-family:'Inter',sans-serif}
.search-bar input:focus{border-color:var(--accent)}
.search-bar input::placeholder{color:var(--text3)}
.search-bar button{background:var(--accent);border:none;border-radius:5px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;color:#000;font-family:'Inter',sans-serif}

.genre-bar{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;background:var(--bg2);border-bottom:1px solid var(--border);scrollbar-width:none}
.genre-bar::-webkit-scrollbar{display:none}
.gtab{flex-shrink:0;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--border);color:var(--text2);background:transparent;transition:all .15s}
.gtab:hover,.gtab.active{background:var(--accent);color:#000;border-color:var(--accent)}

.spotlight{position:relative;height:220px;background:var(--bg3);overflow:hidden}
.spot-img{width:100%;height:100%;object-fit:cover;display:block}
.spot-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(15,15,15,1) 0%,rgba(15,15,15,.6) 40%,rgba(15,15,15,.1) 100%)}
.spot-grad-left{position:absolute;inset:0;background:linear-gradient(to right,rgba(15,15,15,.7) 0%,transparent 60%)}
.spot-content{position:absolute;bottom:12px;left:12px;right:12px}
.spot-badges{display:flex;gap:4px;margin-bottom:5px;flex-wrap:wrap}
.sbadge{padding:2px 6px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:.5px}
.sb-type{background:#ffffff15;color:var(--text2);border:1px solid #ffffff20}
.sb-score{background:#ffbe0020;color:var(--accent);border:1px solid #ffbe0040}
.sb-sub{background:#3db5ff20;color:var(--blue);border:1px solid #3db5ff40}
.sb-dub{background:#4ade8020;color:var(--green);border:1px solid #4ade8040}
.spot-title{font-size:1rem;font-weight:700;color:#fff;line-height:1.2;margin-bottom:5px}
.spot-desc{font-size:10px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
.spot-btns{display:flex;gap:6px}
.sbtn{padding:5px 14px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;border:none;font-family:'Inter',sans-serif}
.sbtn-watch{background:var(--accent);color:#000}
.sbtn-detail{background:rgba(255,255,255,.1);color:var(--text);border:1px solid rgba(255,255,255,.15)}
.spot-count{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);border-radius:4px;padding:3px 8px;font-size:10px;color:var(--text2)}
.spot-dots{display:flex;gap:4px;position:absolute;bottom:10px;right:12px}
.sdot{width:5px;height:5px;border-radius:50%;background:var(--text3);cursor:pointer;transition:all .15s}
.sdot.active{background:var(--accent);width:14px;border-radius:3px}

.section{padding:12px 12px 4px}
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sec-title{font-size:12px;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.5px}
.sec-title::before{content:'';width:3px;height:13px;background:var(--accent);border-radius:2px;flex-shrink:0}
.sec-more{font-size:10px;color:var(--text3);cursor:pointer;transition:color .15s}
.sec-more:hover{color:var(--accent)}

.cards-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.cards-row::-webkit-scrollbar{display:none}
.acard{flex-shrink:0;width:100px;cursor:pointer}
.acard:hover .acard-img-wrap{opacity:.85}
.acard-img-wrap{position:relative;border-radius:5px;overflow:hidden;aspect-ratio:2/3;background:var(--bg3)}
.acard-img{width:100%;height:100%;object-fit:cover;display:block}
.acard-badges{position:absolute;bottom:3px;left:3px;display:flex;gap:2px}
.acb{padding:1px 4px;border-radius:2px;font-size:8px;font-weight:700}
.acb-s{background:#3db5ff;color:#000}
.acb-d{background:#4ade80;color:#000}
.acard-title{font-size:10px;font-weight:500;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.acard-sub{font-size:9px;color:var(--text3);margin-top:1px}

.top10-tabs{display:flex;gap:4px;margin-bottom:8px;background:var(--bg3);border-radius:5px;padding:2px}
.t10tab{flex:1;text-align:center;padding:4px;font-size:10px;font-weight:600;cursor:pointer;border-radius:4px;color:var(--text3);transition:all .15s;letter-spacing:.5px}
.t10tab.active{background:var(--accent);color:#000}
.rank-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);cursor:pointer}
.rank-item:last-child{border-bottom:none}
.rank-item:hover .ri-name{color:var(--accent)}
.ri-num{font-size:12px;font-weight:700;min-width:18px;color:var(--text3)}
.ri-num.gold{color:#ffd700}
.ri-num.silver{color:#c0c0c0}
.ri-num.bronze{color:#cd7f32}
.ri-img{width:32px;height:44px;border-radius:3px;object-fit:cover;background:var(--bg3);flex-shrink:0}
.ri-info{flex:1;min-width:0}
.ri-name{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);transition:color .15s}
.ri-meta{font-size:9px;color:var(--text3);margin-top:2px}
.ri-score{font-size:10px;color:var(--accent);font-weight:600;flex-shrink:0}

.bottomnav{position:sticky;bottom:0;background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:100}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;cursor:pointer;transition:color .15s;color:var(--text3);font-size:9px;gap:3px;letter-spacing:.3px;font-weight:500;text-transform:uppercase}
.bnav-item.active,.bnav-item:hover{color:var(--accent)}
.bnav-icon{font-size:16px}

.page{display:none}
.page.active{display:block}

.anime-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}
.search-hdr{padding:12px 12px 0}
.search-q{font-size:13px;font-weight:700;color:#fff}
.search-q span{color:var(--accent)}
.search-ct{font-size:10px;color:var(--text3);margin-top:2px;margin-bottom:0}

.ph{border-radius:5px;background:var(--bg3);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.8}}
.ph-card{flex-shrink:0;width:100px}
.ph-img{width:100%;aspect-ratio:2/3;border-radius:5px}
.ph-title{height:8px;border-radius:3px;margin-top:4px;width:80%}
.ph-sub{height:7px;border-radius:3px;margin-top:3px;width:50%}

.spin{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin:16px auto;display:block}
@keyframes sp{to{transform:rotate(360deg)}}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--border)}
</style>
</head>
<body>

<!-- TOP NAV -->
<div class="topnav">
  <div class="logo">Ryuk<span>Watches</span></div>
  <div class="nav-right">
    <div class="search-icon-btn" onclick="toggleSearch()">🔍</div>
    <button class="nav-btn btn-login">Login</button>
    <button class="nav-btn btn-signup">Sign Up</button>
  </div>
</div>

<!-- SEARCH BAR -->
<div class="search-bar" id="searchBar">
  <input type="text" id="searchInput" placeholder="Search anime, movies..." onkeydown="if(event.key==='Enter')runSearch(this.value)">
  <button onclick="runSearch(document.getElementById('searchInput').value)">Go</button>
</div>

<!-- GENRE TAB BAR -->
<div class="genre-bar" id="genreBar">
  <div class="gtab active" onclick="setGenreTab(this,'')">All</div>
  <div class="gtab" onclick="setGenreTab(this,'Action')">Action</div>
  <div class="gtab" onclick="setGenreTab(this,'Romance')">Romance</div>
  <div class="gtab" onclick="setGenreTab(this,'Comedy')">Comedy</div>
  <div class="gtab" onclick="setGenreTab(this,'Fantasy')">Fantasy</div>
  <div class="gtab" onclick="setGenreTab(this,'Horror')">Horror</div>
  <div class="gtab" onclick="setGenreTab(this,'Sci-Fi')">Sci-Fi</div>
  <div class="gtab" onclick="setGenreTab(this,'Mystery')">Mystery</div>
  <div class="gtab" onclick="setGenreTab(this,'Sports')">Sports</div>
  <div class="gtab" onclick="setGenreTab(this,'Isekai')">Isekai</div>
  <div class="gtab" onclick="setGenreTab(this,'Mecha')">Mecha</div>
  <div class="gtab" onclick="setGenreTab(this,'Slice of Life')">Slice of Life</div>
</div>

<!-- HOME PAGE -->
<div id="pg-home" class="page active">
  <div class="spotlight" id="spotlight">
    <div style="display:flex;align-items:center;justify-content:center;height:100%"><div class="spin"></div></div>
  </div>

  <div class="section">
    <div class="sec-header"><div class="sec-title">Trending Now</div><div class="sec-more" onclick="navToGrid('trending')">View All</div></div>
    <div class="cards-row" id="row-trending"><div class="ph-card"><div class="ph ph-img"></div><div class="ph ph-title"></div></div><div class="ph-card"><div class="ph ph-img"></div><div class="ph ph-title"></div></div><div class="ph-card"><div class="ph ph-img"></div><div class="ph ph-title"></div></div><div class="ph-card"><div class="ph ph-img"></div><div class="ph ph-title"></div></div><div class="ph-card"><div class="ph ph-img"></div><div class="ph ph-title"></div></div></div>
  </div>

  <div class="section">
    <div class="sec-header"><div class="sec-title">Latest Episodes</div><div class="sec-more" onclick="navToGrid('latest')">View All</div></div>
    <div class="cards-row" id="row-latest"><div class="ph-card"><div class="ph ph-img"></div><div class="ph ph-title"></div></div><div class="ph-card"><div class="ph ph-img"></div><div class="ph ph-title"></div></div><div class="ph-card"><div class="ph ph-img"></div><div class="ph ph-title"></div></div><div class="ph-card"><div class="ph ph-img"></div><div class="ph ph-title"></div></div><div class="ph-card"><div class="ph ph-img"></div><div class="ph ph-title"></div></div></div>
  </div>

  <div class="section">
    <div class="sec-header"><div class="sec-title">Top 10</div></div>
    <div class="top10-tabs">
      <div class="t10tab active" onclick="switchTop10('today',this)">Today</div>
      <div class="t10tab" onclick="switchTop10('week',this)">This Week</div>
      <div class="t10tab" onclick="switchTop10('month',this)">This Month</div>
    </div>
    <div id="top10"><div class="spin"></div></div>
  </div>

  <div class="section">
    <div class="sec-header"><div class="sec-title">Top Airing</div><div class="sec-more" onclick="navToGrid('airing')">View All</div></div>
    <div class="cards-row" id="row-airing"><div class="ph-card"><div class="ph ph-img"></div><div class="ph ph-title"></div></div><div class="ph-card"><div class="ph ph-img"></div><div class="ph ph-title"></div></div><div class="ph-card"><div class="ph ph-img"></div><div class="ph ph-title"></div></div><div class="ph-card"><div class="ph ph-img"></div><div class="ph ph-title"></div></div><div class="ph-card"><div class="ph ph-img"></div><div class="ph ph-title"></div></div></div>
  </div>

  <div class="section" style="padding-bottom:1rem">
    <div class="sec-header"><div class="sec-title">Most Popular</div><div class="sec-more" onclick="navToGrid('popular')">View All</div></div>
    <div class="cards-row" id="row-popular"><div class="ph-card"><div class="ph ph-img"></div><div class="ph ph-title"></div></div><div class="ph-card"><div class="ph ph-img"></div><div class="ph ph-title"></div></div><div class="ph-card"><div class="ph ph-img"></div><div class="ph ph-title"></div></div><div class="ph-card"><div class="ph ph-img"></div><div class="ph ph-title"></div></div><div class="ph-card"><div class="ph ph-img"></div><div class="ph ph-title"></div></div></div>
  </div>
</div>

<!-- TOP RATED PAGE -->
<div id="pg-top" class="page">
  <div class="section"><div class="sec-header"><div class="sec-title">Top Rated</div></div></div>
  <div class="anime-grid" id="grid-top"></div>
</div>

<!-- MOVIES PAGE -->
<div id="pg-movies" class="page">
  <div class="section"><div class="sec-header"><div class="sec-title">Movies</div></div></div>
  <div class="anime-grid" id="grid-movies"></div>
</div>

<!-- SEARCH PAGE -->
<div id="pg-search" class="page">
  <div class="search-hdr">
    <div class="search-q">Results for <span id="sq-label"></span></div>
    <div class="search-ct" id="sq-count"></div>
  </div>
  <div class="anime-grid" id="grid-search"></div>
</div>

<!-- BOTTOM NAV -->
<div class="bottomnav">
  <div class="bnav-item active" id="bn-home" onclick="switchPage('home',this)"><div class="bnav-icon">🏠</div>Home</div>
  <div class="bnav-item" id="bn-top" onclick="switchPage('top',this)"><div class="bnav-icon">🏆</div>Top</div>
  <div class="bnav-item" id="bn-movies" onclick="switchPage('movies',this)"><div class="bnav-icon">🎬</div>Movies</div>
  <div class="bnav-item" id="bn-search" onclick="toggleSearch();switchPage('home',document.getElementById('bn-home'))"><div class="bnav-icon">🔍</div>Search</div>
</div>

<script>
const BASE='https://api.jikan.moe/v4';
let spotData=[],spotIdx=0,spotTimer=null;
let top10Cache={today:[],week:[],month:[]};
let loaded={top:false,movies:false};

async function api(path){
  try{const r=await fetch(BASE+path);if(!r.ok)return[];const j=await r.json();return j.data||[];}catch{return[];}
}

function e(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}

function cardHTML(a){
  const img=a.images?.jpg?.image_url||'';
  const title=e(a.title||'');
  const score=a.score?'★ '+a.score.toFixed(1):'';
  const type=a.type||'';
  return `<div class="acard" onclick="window.open('https://myanimelist.net/anime/${a.mal_id}','_blank')">
    <div class="acard-img-wrap">
      ${img?`<img class="acard-img" src="${img}" alt="${title}" loading="lazy">`:''}
      <div class="acard-badges"><span class="acb acb-s">SUB</span>${type==='TV'||type==='Movie'?'<span class="acb acb-d">DUB</span>':''}</div>
    </div>
    <div class="acard-title" title="${title}">${title}</div>
    <div class="acard-sub">${score}</div>
  </div>`;
}

function gridCardHTML(a){
  const img=a.images?.jpg?.image_url||'';
  const title=e(a.title||'');
  const score=a.score?'★ '+a.score.toFixed(1):'';
  return `<div style="cursor:pointer" onclick="window.open('https://myanimelist.net/anime/${a.mal_id}','_blank')">
    <div style="border-radius:5px;overflow:hidden;aspect-ratio:2/3;background:var(--bg3)">
      ${img?`<img src="${img}" alt="${title}" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block">`:''}
    </div>
    <div style="font-size:10px;font-weight:500;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)">${title}</div>
    <div style="font-size:9px;color:var(--accent);margin-top:1px">${score}</div>
  </div>`;
}

function renderSpot(i){
  const a=spotData[i];if(!a)return;
  const img=a.images?.jpg?.large_image_url||a.images?.jpg?.image_url||'';
  const score=a.score?a.score.toFixed(1):'N/A';
  const desc=(a.synopsis||'').replace(/\[Written.*?\]/g,'').trim();
  const dots=spotData.map((_,j)=>`<div class="sdot${j===i?' active':''}" onclick="goSpot(${j})"></div>`).join('');
  document.getElementById('spotlight').innerHTML=`
    ${img?`<img class="spot-img" src="${img}" alt="${e(a.title)}">`:''}
    <div class="spot-grad"></div><div class="spot-grad-left"></div>
    <div class="spot-count">${i+1} / ${spotData.length}</div>
    <div class="spot-content">
      <div class="spot-badges">
        <span class="sbadge sb-type">${e(a.type||'TV')}</span>
        <span class="sbadge sb-score">★ ${score}</span>
        <span class="sbadge sb-sub">SUB</span>
        <span class="sbadge sb-dub">DUB</span>
      </div>
      <div class="spot-title">${e(a.title)}</div>
      <div class="spot-desc">${e(desc)}</div>
      <div class="spot-btns">
        <button class="sbtn sbtn-watch" onclick="window.open('https://myanimelist.net/anime/${a.mal_id}','_blank')">▶ Watch Now</button>
        <button class="sbtn sbtn-detail" onclick="window.open('https://myanimelist.net/anime/${a.mal_id}','_blank')">Detail</button>
      </div>
    </div>
    <div class="spot-dots">${dots}</div>`;
}

function goSpot(i){spotIdx=i;renderSpot(i);}

function renderTop10(data){
  const colors=['gold','silver','bronze'];
  return data.slice(0,10).map((a,i)=>{
    const img=a.images?.jpg?.small_image_url||a.images?.jpg?.image_url||'';
    const score=a.score?a.score.toFixed(1):'—';
    return `<div class="rank-item" onclick="window.open('https://myanimelist.net/anime/${a.mal_id}','_blank')">
      <div class="ri-num${i<3?' '+colors[i]:''}">${String(i+1).padStart(2,'0')}</div>
      ${img?`<img class="ri-img" src="${img}" alt="" loading="lazy">`:`<div class="ri-img"></div>`}
      <div class="ri-info">
        <div class="ri-name">${e(a.title)}</div>
        <div class="ri-meta">${a.type||'TV'} · ${a.episodes?a.episodes+' eps':'Ongoing'}</div>
      </div>
      <div class="ri-score">★${score}</div>
    </div>`;
  }).join('');
}

async function loadHome(){
  const [trending,latest,airing,popular,top10today]=await Promise.all([
    api('/top/anime?filter=airing&limit=15'),
    api('/top/anime?filter=airing&limit=15&page=2'),
    api('/top/anime?filter=airing&limit=15&page=3'),
    api('/top/anime?filter=bypopularity&limit=15'),
    api('/top/anime?filter=airing&limit=10'),
  ]);
  if(trending.length){
    spotData=trending.slice(0,5);
    renderSpot(0);
    clearInterval(spotTimer);
    spotTimer=setInterval(()=>{spotIdx=(spotIdx+1)%spotData.length;renderSpot(spotIdx);},5000);
    document.getElementById('row-trending').innerHTML=trending.map(cardHTML).join('');
  }
  if(latest.length) document.getElementById('row-latest').innerHTML=latest.map(cardHTML).join('');
  if(airing.length) document.getElementById('row-airing').innerHTML=airing.map(cardHTML).join('');
  if(popular.length) document.getElementById('row-popular').innerHTML=popular.map(cardHTML).join('');
  top10Cache.today=top10today;
  top10Cache.week=top10today.slice().sort(()=>Math.random()-.5);
  top10Cache.month=[...popular.slice(0,10)];
  document.getElementById('top10').innerHTML=renderTop10(top10today);
}

function switchTop10(key,el){
  document.querySelectorAll('.t10tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  const data=top10Cache[key]||[];
  document.getElementById('top10').innerHTML=data.length?renderTop10(data):'<div class="spin"></div>';
}

async function navToGrid(type){
  switchPage('top',document.getElementById('bn-top'));
  if(loaded.top) return;
  loaded.top=true;
  const data=await api('/top/anime?filter='+type+'&limit=24');
  document.getElementById('grid-top').innerHTML=data.map(gridCardHTML).join('');
}

async function switchPage(name,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('pg-'+name).classList.add('active');
  document.querySelectorAll('.bnav-item').forEach(b=>b.classList.remove('active'));
  if(el) el.classList.add('active');
  if(name==='top'&&!loaded.top){
    loaded.top=true;
    document.getElementById('grid-top').innerHTML='<div style="grid-column:1/-1"><div class="spin"></div></div>';
    const data=await api('/top/anime?limit=24');
    document.getElementById('grid-top').innerHTML=data.map(gridCardHTML).join('');
  }
  if(name==='movies'&&!loaded.movies){
    loaded.movies=true;
    document.getElementById('grid-movies').innerHTML='<div style="grid-column:1/-1"><div class="spin"></div></div>';
    const data=await api('/top/anime?type=movie&limit=24');
    document.getElementById('grid-movies').innerHTML=data.map(gridCardHTML).join('');
  }
}

async function runSearch(q){
  if(!q.trim()) return;
  document.getElementById('sq-label').textContent='"'+q+'"';
  document.getElementById('sq-count').textContent='Searching...';
  document.getElementById('grid-search').innerHTML='<div style="grid-column:1/-1"><div class="spin"></div></div>';
  switchPage('search',null);
  document.querySelectorAll('.bnav-item').forEach(b=>b.classList.remove('active'));
  const data=await api('/anime?q='+encodeURIComponent(q)+'&limit=24&order_by=score&sort=desc');
  document.getElementById('sq-count').textContent=data.length?data.length+' results':'No results found';
  document.getElementById('grid-search').innerHTML=data.length?data.map(gridCardHTML).join(''):'<div style="color:var(--text3);padding:1rem;grid-column:1/-1;text-align:center">No results</div>';
  document.getElementById('searchBar').classList.remove('open');
}

async function setGenreTab(el,genre){
  document.querySelectorAll('.gtab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  if(!genre) return;
  await runSearch(genre);
}

function toggleSearch(){
  const sb=document.getElementById('searchBar');
  sb.classList.toggle('open');
  if(sb.classList.contains('open')) document.getElementById('searchInput').focus();
}

loadHome();
</script>
</body>
</html>
